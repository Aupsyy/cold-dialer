# Supabase en local (supabase start) et en CI. Aucune clé ici : celles de la base locale sont publiques et fixes.
project_id = "cold-dialer"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
# La graine de démonstration (supabase/seed-demo.sql) se joue à la demande, jamais au « db reset ».
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/auth/callback", "http://localhost:3000/auth/callback"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false
