# Intégration continue : d'abord gitleaks (tout l'historique, version figée, somme vérifiée), puis lint, types, tests (config, garde-fous,
# en-têtes, middleware, publication), base Supabase locale remise à zéro
# puis tests SQL (un par table et par lot), tests node qui ont besoin de la base, build. Aucun secret n'est nécessaire, sauf la liste des
# termes interdits du mainteneur (TERMES_INTERDITS), facultative.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secrets (gitleaks, tout l'historique)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (version figée, somme SHA-256 vérifiée)
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --no-banner --redact --verbose

  verifier:
    needs: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Types
        run: npx tsc --noEmit

      - name: Tests
        run: npm test
        env:
          # La liste des termes interdits du mainteneur (secret du dépôt) : sans elle, le contrôle de publication saute cette partie.
          TERMES_INTERDITS: ${{ secrets.TERMES_INTERDITS }}

      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0

      - name: Supabase local
        run: supabase start

      - name: Base remise à zéro (migrations)
        run: supabase db reset

      - name: Tests SQL
        run: npm run test:sql
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      - name: Tests avec base (ceux que « Tests » saute sans base)
        run: npm run test:base
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      - name: Build
        run: npm run build
